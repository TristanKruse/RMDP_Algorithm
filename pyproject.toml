[project]
name = "restaurant-delivery"
version = "0.1.0"
description = "Restaurant meal delivery optimization using reinforcement learning"
authors = [
    {name = "Tristan Kruse"}
]
requires-python = ">=3.8"
readme = "README.md"
license = {text = "Copyright (c) 2024 Tristan Kruse. All rights reserved."}

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "torch>=1.9.0",
    "tqdm>=4.62.0",
    "pyyaml>=5.4.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["environment", "models", "training"]
